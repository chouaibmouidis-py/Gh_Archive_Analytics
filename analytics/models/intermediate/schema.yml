version: 2

models:
  - name: fct_repo_daily_activity
    description: "Daily activity summary for each GitHub repository."
    columns:
      - name: repo_id
        data_tests:
          - not_null
      - name: event_date
        data_tests:
          - not_null

  - name: fct_event_type_daily
    description: "Daily event counts per event type."
    columns:
      - name: event_date
        data_tests:
          - not_null
      - name: event_type
        data_tests:
          - not_null