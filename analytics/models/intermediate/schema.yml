version: 2

models:
  - name: int_events_deduplicated
    description: "Intermediate table with deduplicated GitHub events."
    columns:
      - name: event_id
        data_tests:
            - not_null
            - unique
      - name: repo_id
        data_tests:
            - not_null
      - name: actor_id
        data_tests:
            - not_null
      - name: event_date
        data_tests:
            - not_null
 