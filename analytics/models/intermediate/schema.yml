version: 2

models:
  - name: dim_repo
    description: "One row per GitHub repository with activity summary."
    columns:
      - name: repo_id
        data_tests:
            - not_null
            - unique
  - name: dim_actor
    description: "One row per GitHub user with activity summary."
    columns:
      - name: actor_id
        data_tests:
            - not_null
            - unique
  - name: int_events_deduplicated
    description: "One row per GitHub event (incremental)."
    columns:
      - name: event_id
        data_tests:
            - not_null
            - unique
