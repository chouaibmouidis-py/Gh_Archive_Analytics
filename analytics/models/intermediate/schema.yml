version: 2

models:
  - name: int_events_deduplicated
    description: "Deduplicated GH Archive events (one row per event_id)."
    columns:
      - name: event_id
        description: "Unique identifier for the GitHub event."
        data_tests:
          - not_null
          - unique
      - name: event_date
        description: "Date of the GitHub event."
        data_tests:
          - not_null
      - name: repo_id
        description: "Unique identifier for the repository associated with the event."
        data_tests:
          - not_null
      - name: actor_id
        description: "Unique identifier for the actor (user) who triggered the event."
        data_tests:
          - not_null