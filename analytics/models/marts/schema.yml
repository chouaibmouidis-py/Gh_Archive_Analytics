models:
  - name: int_events_deduplicated
    description: "Deduplicated GH Archive events (one row per event_id)."
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: event_date
        data_tests:
          - not_null
      - name: repo_id
        data_tests:
          - not_null
      - name: actor_id
        data_tests:
          - not_null