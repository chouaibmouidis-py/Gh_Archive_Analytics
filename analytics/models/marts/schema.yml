version: 2

models:
  - name: dim_repo
    description: "One row per GitHub repository with activity summary."
    columns:
      - name: repo_id
        data_tests:
            - not_null
            - unique
  - name: dim_actor
    description: "One row per GitHub user with activity summary."
    columns:
      - name: actor_id
        data_tests:
            - not_null
            - unique
  - name: fct_repo_daily_activity
    description: "Daily activity summary for each GitHub repository."
    columns:
      - name: repo_id
        data_tests:
            - not_null
      - name: event_date
        data_tests:
            - not_null
  
