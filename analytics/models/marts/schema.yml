models:
  - name: int_events_deduplicated
    description: "Deduplicated GH Archive events (one row per event_id)."
    columns:
      - name: event_id
        description: "Unique identifier for the event."
        data_tests:
          - not_null
          - unique
      - name: event_date
        description: "Date of the event."
        data_tests:
          - not_null
      - name: repo_id
        description: "Unique identifier for the repository."
        data_tests:
          - not_null
      - name: actor_id
        description: "Unique identifier for the actor."
        data_tests:
          - not_null