version: 2

models:
  - name: stg_events
    description: "GH Archive events with flattened actor/repo/org fields (not deduplicated; deduplication happens in fct_events)."
    columns:
      - name: event_id
        description: "GitHub event identifier. May repeat in the bronze layer."
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: event_type
        data_tests:
          - not_null
      - name: event_at
        data_tests:
          - not_null

